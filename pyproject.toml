[project]
name = "modelthinker"
version = "0.1.0"
description = "Interactive Python implementations of models from Scott E. Page's The Model Thinker (2018)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ModelThinker contributors" }]
dependencies = [
    "streamlit>=1.36",
    "numpy>=1.26",
    "scipy>=1.13",
    "plotly>=5.22",
    "pandas>=2.2",
    "networkx>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "jupyter>=1.0",
    "nbformat>=5.10",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelthinker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length; E701/E702: allow one-line if/return for compact math tables.
ignore = ["E501", "E701", "E702", "E741"]

[tool.ruff.lint.per-file-ignores]
# Streamlit pages must call st.set_page_config before anything else, so sys.path
# tweaks and downstream imports genuinely happen after top-level statements.
"app/pages/*.py" = ["E402"]
"app/Home.py"    = ["E402"]
"tests/*.py"     = ["B007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]
