# Lock Streamlit to a light theme so the plotly chart theme (light bg,
# dark text, subtle grid) always matches the page it's rendered on.
# Change base = "dark" if you prefer dark mode — but also flip the
# legend/font colors in src/modelthinker/core/plotting.py.

[theme]
base = "light"
primaryColor = "#4C6EF5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8F9FA"
textColor = "#212529"
font = "sans serif"

[browser]
gatherUsageStats = false
